<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Studio Account — ANALOGUE & CO.</title>
  <meta name="description" content="Register for a private Analogue & Co. client vault and customization studio.">
  
  <!-- CSS Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page-body">

  <!-- Fixed Top Action Controls (Outside container for clean Mobile 360 view) -->
  <div class="auth-fixed-controls">
    <button class="audio-toggle-btn" id="themeToggle" title="Toggle Light / Dark Mode">
      <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
    </button>
    <button class="audio-toggle-btn" id="rtlToggle" title="Toggle RTL / LTR Layout">
      <span style="font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;">RTL</span>
    </button>
  </div>

  <div class="auth-card-container">
    <div class="auth-card">
      
      <!-- Brand Seal (Clickable to Home) -->
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand-logo mb-2" style="justify-content: center;">
          <div class="brand-icon-seal">
            <i data-lucide="camera" style="width: 20px; height: 20px;"></i>
          </div>
          <span class="brand-name">ANCO</span>
        </a>
        <div class="font-mono-tag text-brass" style="font-size: 0.7rem; letter-spacing: 0.15em;">CLIENT STUDIO VAULT</div>
      </div>

      <h2 class="font-display fs-4 text-center mb-1 text-cream">Create Studio Account</h2>
      <p class="text-cream-muted text-center small mb-4">Start your bespoke monogram design, hold your event date, and manage keepsakes.</p>

      <!-- Sign Up Form (One-by-one input stack) -->
      <form id="registerForm" action="dashboard.html" method="get">
        <div class="mb-3 text-start">
          <label class="form-label-vintage" for="regName">Your Full Name / Event Host</label>
          <div class="input-group">
            <span class="input-group-text bg-midnight border-midnight text-brass" style="border-right: none;">
              <i data-lucide="user" style="width: 16px; height: 16px;"></i>
            </span>
            <input type="text" id="regName" class="form-control form-control-vintage" placeholder="e.g. Sarah & Michael Jenkins" required style="border-left: none;">
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-vintage" for="regEmail">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-midnight border-midnight text-brass" style="border-right: none;">
              <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
            </span>
            <input type="email" id="regEmail" class="form-control form-control-vintage" placeholder="sarah@example.com" required style="border-left: none;">
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-vintage" for="regPhone">Phone / WhatsApp Number</label>
          <div class="input-group">
            <span class="input-group-text bg-midnight border-midnight text-brass" style="border-right: none;">
              <i data-lucide="phone" style="width: 16px; height: 16px;"></i>
            </span>
            <input type="tel" id="regPhone" class="form-control form-control-vintage" placeholder="+91 98765 43210" required style="border-left: none;">
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-vintage" for="regDate">Event Celebration Date</label>
          <div class="input-group">
            <span class="input-group-text bg-midnight border-midnight text-brass" style="border-right: none;">
              <i data-lucide="calendar" style="width: 16px; height: 16px;"></i>
            </span>
            <input type="date" id="regDate" class="form-control form-control-vintage" value="2026-11-28" required style="border-left: none;">
          </div>
        </div>

        <div class="mb-3 text-start">
          <label class="form-label-vintage" for="regPin">Create 4-Digit Studio PIN</label>
          <div class="input-group">
            <span class="input-group-text bg-midnight border-midnight text-brass" style="border-right: none;">
              <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
            </span>
            <input type="password" id="regPin" class="form-control form-control-vintage" placeholder="e.g. 1968" required style="border-left: none;">
          </div>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label-vintage" for="regPackage">Preferred Experience</label>
          <select id="regPackage" class="form-select form-control-vintage" required>
            <option value="The Icon (Signature Oak Booth)">The Icon (Signature Solid Oak Booth) — $1,450</option>
            <option value="The Flagship Aura">The Flagship Aura (Studio Experience) — $1,950</option>
            <option value="The Frame (Digital Retro)">The Frame (Digital Vintage Retro) — $850</option>
            <option value="Instant Camera Guestbook Bar">Instant Camera Guestbook Bar — $450</option>
          </select>
        </div>

        <button type="submit" class="btn btn-vintage-brass w-100 py-3 mb-3">
          <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i> Create Studio & Hold Inquiry
        </button>

        <!-- Social Sign Up Dividers -->
        <div class="d-flex align-items-center my-3">
          <hr class="flex-grow-1 border-midnight m-0">
          <span class="px-3 font-mono-tag text-cream-muted" style="font-size: 0.65rem;">OR REGISTER WITH</span>
          <hr class="flex-grow-1 border-midnight m-0">
        </div>

        <div class="d-flex gap-2 mb-4">
          <button type="button" class="social-auth-btn" onclick="window.location.href='dashboard.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Google</span>
          </button>
          <button type="button" class="social-auth-btn" onclick="window.location.href='dashboard.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.86c.62-.76 1.04-1.81.93-2.86-.9.04-2 .6-2.65 1.36-.58.67-.99 1.74-.86 2.78.99.08 1.96-.52 2.58-1.28z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <div class="text-center pt-2 border-top border-midnight">
          <p class="text-cream-muted small mb-0">
            Already have a studio account? 
            <a href="login.html" class="text-peach fw-bold text-decoration-none ms-1">Sign In</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
